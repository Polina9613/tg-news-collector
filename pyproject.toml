[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-news-collector"
version = "0.1.0"
description = "MVP системы для сбора и структурирования новостей из Telegram-каналов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.34",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "typer>=0.12",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
    "python-docx>=1.1",
    "transliterate>=1.10",
    "aiogram>=3.13",
    "apscheduler>=3.10",
    "feedparser>=6.0",
    "readability-lxml>=0.8",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
tg-news = "cli.main:app"

[tool.setuptools.packages.find]
include = ["bot", "cli", "collector", "config", "db", "digest", "exporter", "llm", "processor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
